name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the CLI
        run: python -m pip install --disable-pip-version-check -e '.[test]'

      - name: Smoke-test the installed command
        run: madp --help

      - name: Run the full test suite
        run: python -m unittest discover -s tests

      - name: Run the repository verifier
        run: python scripts/verify.py

      - name: Run a complete safe demo
        run: bash examples/two-hermes/run.sh

      - name: Require no tracked-file drift
        run: test -z "$(git status --porcelain --untracked-files=no)"
